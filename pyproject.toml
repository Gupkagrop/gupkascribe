[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gupkascribe"
version = "0.2.0"
description = "GupkaScribe Studio — автономный AI-конвейер обработки лекций и мультимодальная база знаний Obsidian с десктопным GUI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Denis", email = "denis@local" }
]
dependencies = [
    "customtkinter>=6.0.0",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
